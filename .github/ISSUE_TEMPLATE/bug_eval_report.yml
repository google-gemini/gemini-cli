name: 'Bug → Eval Report'
description: 'Observed a behavioral bug? Help us turn it into a regression eval.'
labels:
  - 'bug'
  - 'eval-candidate'
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for helping us improve Gemini CLI's reliability!
        >
        > This template is for reporting **behavioral bugs** — cases where the agent
        > did the wrong thing (wrong tool, wrong edit, wrong decision) rather than crashing.
        > Behavioral bugs can be turned directly into regression evals using `eval:from-log`.
        >
        > Please search **[existing issues](https://github.com/google-gemini/gemini-cli/issues)**
        > before filing a new one.

  - type: 'textarea'
    id: 'bug-description'
    attributes:
      label: 'What did the agent do wrong?'
      description: 'A clear, concise description of the incorrect behavior.'
      placeholder: |
        Example: "I asked the agent to 'clean up unused imports' and it deleted
        the entire file instead."
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
      placeholder: 'Example: "It should have removed only the unused import statements."'
    validations:
      required: true

  - type: 'textarea'
    id: 'session-log'
    attributes:
      label: 'Session log (JSONL)'
      description: |-
        Paste your session JSONL file here or attach it as a file.

        **How to find your session file:**
        - macOS / Linux: `ls ~/.gemini/*/chats/session-*.jsonl`
        - Windows: `dir %USERPROFILE%\.gemini\*\chats\`
        - Or use `/history` inside Gemini CLI to locate recent sessions.

        > [!WARNING]
        > Session logs may contain file contents, prompts, and tool outputs from
        > your local workspace. **Review before pasting** and remove any sensitive
        > information. The `eval:from-log` tool will also sanitize absolute paths
        > and known secret patterns automatically.

        **Generate an eval skeleton from this log:**
        ```bash
        npm run eval:from-log -- /path/to/your/session.jsonl
        ```
      placeholder: 'Paste session JSONL content here, or attach the .jsonl file below.'
    validations:
      required: false

  - type: 'textarea'
    id: 'workspace-description'
    attributes:
      label: 'Workspace / file context'
      description: |-
        If you cannot share the session log, describe the relevant workspace
        structure (files, their contents, directory layout) so we can reproduce
        the scenario manually.
      placeholder: |
        Example:
        - src/app.ts — a 50-line TypeScript file with an exported `add()` function
        - package.json — standard Node.js package with no unusual dependencies
    validations:
      required: false

  - type: 'textarea'
    id: 'client-info'
    attributes:
      label: 'Client information'
      description: |-
        Paste the output of `/about` from inside Gemini CLI.
        Note: this output includes your email address — consider removing it before submitting.
      value: |-
        <details>
        <summary>Client Information</summary>

        Run `gemini` to enter the interactive CLI, then run `/about`.

        ```console
        > /about
        # paste output here
        ```

        </details>
    validations:
      required: false

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Anything else?'
      description: 'Any additional context, screenshots, or related issues.'
    validations:
      required: false
