name: 'Evals: PR Evaluation & Regression'

on:
  pull_request_target:
    types: ['opened', 'synchronize', 'reopened', 'ready_for_review']
    paths:
      - 'packages/core/src/prompts/**'
      - 'packages/core/src/tools/**'
      - 'packages/core/src/agents/**'
      - 'evals/**'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  pull-requests: 'write'
  contents: 'read'
  actions: 'read'

jobs:
  detect-changes:
    name: 'Detect Steering Changes'
    runs-on: 'gemini-cli-ubuntu-16-core'
    if: "github.repository == 'google-gemini/gemini-cli' && github.event.pull_request.draft == false"
    outputs:
      SHOULD_RUN: '${{ steps.detect.outputs.SHOULD_RUN }}'
      STEERING_DETECTED: '${{ steps.detect.outputs.STEERING_DETECTED }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Detect Steering Changes'
        id: 'detect'
        env:
          PR_HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |
          set -euo pipefail
          git fetch "origin pull/${PR_NUMBER}/head:pr-head"
          SHOULD_RUN=$(node scripts/changed_prompt.js)
          STEERING_DETECTED=$(node scripts/changed_prompt.js --steering-only)
          echo "SHOULD_RUN=${SHOULD_RUN}" >> "$GITHUB_OUTPUT"
          echo "STEERING_DETECTED=${STEERING_DETECTED}" >> "$GITHUB_OUTPUT"

      - name: 'Notify Approval Required'
        if: "steps.detect.outputs.SHOULD_RUN == 'true'"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          COMMENT_BODY=$(cat <<EOF
          ### 🛑 Action Required: Evaluation Approval

          Steering changes have been detected in this PR. To prevent regressions, a maintainer must approve the evaluation run before this PR can be merged.

          **Maintainers:**
          1. Go to the [**Workflow Run Summary**](${RUN_URL}).
          2. Click the yellow **'Review deployments'** button.
          3. Select the **'eval-gate'** environment and click **'Approve'**.

          Once approved, the evaluation results will be posted here automatically.

          <!-- eval-approval-notification -->
          EOF
          )

          COMMENT_ID=$(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[] | select(.body | contains("<!-- eval-approval-notification -->")) | .url' | grep -oE "[0-9]+$" | head -n 1 || true)

          if [ -z "${COMMENT_ID}" ]; then
            gh pr comment "${PR_NUMBER}" --body "${COMMENT_BODY}"
          else
            echo "Updating existing notification comment ${COMMENT_ID}..."
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body="${COMMENT_BODY}"
          fi

  pr-evaluation:
    name: 'Evaluate Steering & Regressions'
    needs: 'detect-changes'
    if: "needs.detect-changes.outputs.SHOULD_RUN == 'true'"
    environment: 'eval-gate'
    runs-on: 'gemini-cli-ubuntu-16-core'
    env:
      MODEL_LIST: 'gemini-3-flash-preview'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955'
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: 'Remove Approval Notification'
        if: 'always()'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |
          set -euo pipefail
          COMMENT_ID=$(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[] | select(.body | contains("<!-- eval-approval-notification -->")) | .url' | grep -oE "[0-9]+$" | head -n 1 || true)
          if [ -n "${COMMENT_ID}" ]; then
            echo "Removing notification comment ${COMMENT_ID}..."
            gh api -X DELETE "repos/${REPO}/issues/comments/${COMMENT_ID}"
          fi

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Analyze PR Content (Guidance)'
        if: "needs.detect-changes.outputs.STEERING_DETECTED == 'true'"
        id: 'analysis'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          ACTOR: '${{ github.actor }}'
          BASE_REF: '${{ github.base_ref }}'
        run: |
          set -euo pipefail
          EVAL_CHANGES=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep '^evals/' || true)
          if [ -z "${EVAL_CHANGES}" ]; then
            echo "MISSING_EVALS=true" >> "$GITHUB_OUTPUT"
          fi

          USER_PERMISSION=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')
          if [[ "${USER_PERMISSION}" == "admin" || "${USER_PERMISSION}" == "write" ]]; then
            echo "IS_MAINTAINER=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Execute Regression Check'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          MODEL_LIST: '${{ env.MODEL_LIST }}'
        run: |
          set -euo pipefail
          node scripts/run_eval_regression.js
          if [[ -f eval_regression_report.md ]]; then
            echo "REPORT_FILE=eval_regression_report.md" >> "$GITHUB_ENV"
          fi

      - name: 'Post or Update PR Comment'
        if: "always() && (needs.detect-changes.outputs.STEERING_DETECTED == 'true' || env.REPORT_FILE != '')"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          STEERING_DETECTED: '${{ needs.detect-changes.outputs.STEERING_DETECTED }}'
          MISSING_EVALS: '${{ steps.analysis.outputs.MISSING_EVALS }}'
          IS_MAINTAINER: '${{ steps.analysis.outputs.IS_MAINTAINER }}'
        run: |
          set -euo pipefail
          {
            if [[ -f eval_regression_report.md ]]; then
              cat eval_regression_report.md
              echo ""
            fi

            if [[ "${STEERING_DETECTED}" == "true" ]]; then
              echo "### 🧠 Model Steering Guidance"
              echo ""
              echo "This PR modifies files that affect the model's behavior (prompts, tools, or instructions)."
              echo ""

              if [[ "${MISSING_EVALS}" == "true" ]]; then
                echo "- ⚠️ **Consider adding Evals:** No behavioral evaluations (\`evals/*.eval.ts\`) were added or updated in this PR. Consider adding a test case."
              fi

              if [[ "${IS_MAINTAINER}" == "true" ]]; then
                echo "- 🚀 **Maintainer Reminder:** Please ensure that these changes do not regress results on benchmark evals before merging."
              fi
            fi

            echo ""
            echo "---"
            echo "*This is an automated guidance message triggered by steering logic signatures.*"
            echo "<!-- eval-pr-report -->"
          } > full_comment.md

          COMMENT_ID=$(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[] | select(.body | contains("<!-- eval-pr-report -->")) | .url' | grep -oE "[0-9]+$" | head -n 1 || true)

          if [ -n "${COMMENT_ID}" ]; then
            echo "Updating existing comment ${COMMENT_ID}..."
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@full_comment.md
          else
            echo "Creating new PR comment..."
            gh pr comment "${PR_NUMBER}" --body-file full_comment.md
          fi
