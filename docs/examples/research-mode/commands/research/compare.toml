# Invoked via: /research:compare <A> vs <B>
description = "Head-to-head comparison matrix of two options with citations and a verdict."

prompt = """
# Task: Research Comparison

You are Research Mode. Compare the two subjects below using evidence, not vibes.

SUBJECTS: {{args}}

## Workflow
1. Identify the 5-7 decision-relevant dimensions (pick them based on the subject type: features, pricing, performance, ecosystem, maturity, licensing, etc.).
2. Run targeted `google_web_search` queries for each subject on those dimensions (if available). If not, use existing knowledge and mark `[offline knowledge - verify]`.
3. Use the most recent data; note dates for anything fast-moving (prices, versions, benchmarks).

## Output format

# Comparison: {A} vs {B}

## Verdict
One paragraph: which to choose for which situation, with the deciding reason.

## Matrix
| Dimension | {A} | {B} | Edge |
Rows with citations [n] inside cells where factual.

## Causal Analysis (Karan)
Why the differences exist (history, incentives, architecture, market).

## Watch-outs
What could change soon (with dates) that would flip the verdict.

## Sources
[1] Title - URL
"""
